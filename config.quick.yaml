seed: 42

data:
  use_ccxt: false
  exchange: binance
  timeframe: 1d
  limit: 500
  cache_dir: cache
  symbols: [BTC/USDT, ETH/USDT, BNB/USDT, SOL/USDT, XRP/USDT]
  start: 2021-01-01
  end: 2024-12-31
  align: intersection

features:
  include_prev_weights: true
  normalize_cross_section: true
  list: [momentum_7, momentum_30, volatility_30, volume_z_30, rsi_14, ema_slope_20, price_to_ma_30, reversal_1, corr_with_btc_60]

env:
  trading_cost_rate: 0.0005
  reward: log_return

rl:
  total_timesteps: 3000
  rollout_length: 128
  n_epochs: 5
  minibatch_size: 64
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  hidden_sizes: [128, 128]
  eval_interval: 500

split:
  train_end: 2023-06-30
  val_end: 2024-06-30

output:
  checkpoints_dir: checkpoints
  outputs_dir: outputs
  logs_dir: logs
